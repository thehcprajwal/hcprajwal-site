AWSTemplateFormatVersion: "2010-09-09"
Description: >
  hc-site v2 CI - lets GitHub Actions deploy the app stack without any stored AWS keys.
  GitHub proves who it is with a short-lived OIDC token, and only pushes to the main branch of
  one repository can assume the deploy role. Deploy once (us-east-1).

Parameters:
  GitHubRepo:
    Type: String
    Default: thehcprajwal/hcprajwal-site
    Description: owner/name of the repository allowed to deploy
  Branch:
    Type: String
    Default: main
  FunctionName:
    Type: String
    Default: hc-site

Resources:
  # The account's trust relationship with GitHub (one per account).
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # The role GitHub Actions assumes. It can only start CloudFormation, upload the code zip,
  # and hand the work to the CloudFormation role below.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${FunctionName}-github-deploy"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidcProvider }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:ref:refs/heads/${Branch}"
      Policies:
        - PolicyName: deploy-app-stack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RunTheStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${FunctionName}-app/*"
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${FunctionName}-base/*"
              - Sid: ClearCacheAfterDeploy
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"
              - Sid: UploadCode
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub "arn:aws:s3:::${FunctionName}-base-codebucket-*/*"
              - Sid: HandWorkToCloudFormationRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationRole.Arn

  # The role CloudFormation uses to create and change the app's resources.
  # Limited to the services the app stack uses.
  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${FunctionName}-cloudformation"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: manage-app-resources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["lambda:*", "cloudfront:*"]
                Resource: "*"
              - Effect: Allow
                Action: [acm:DescribeCertificate, acm:ListCertificates, acm:GetCertificate]
                Resource: "*"
              - Effect: Allow
                Action: [iam:PassRole, iam:GetRole]
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${FunctionName}-web-role"
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub "arn:aws:s3:::${FunctionName}-base-codebucket-*/*"

Outputs:
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationRoleArn:
    Value: !GetAtt CloudFormationRole.Arn
